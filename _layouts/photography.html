<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Victor Y. Hsu</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .photography-content {
      margin: 0;
      padding: 52px 0 0 0;
      width: 100%;
      max-width: none;
    }

    .photo-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 52px);
      background: white;
    }

    .photo-intro-text {
      padding: 70px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }

    .photo-intro-text h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 34px;
    }

    .photo-intro-text p {
      font-size: 18px;
      line-height: 1.8;
      margin: 0;
    }

    .photo-intro-image {
      width: 100%;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    .photo-intro-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-section {
      margin: 0;
      padding: 0;
      width: 100%;
      line-height: 0;
    }

    .photo-section img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    #photo-nav {
      transition: transform 0.3s ease;
    }

    #photo-nav.nav-hidden {
      transform: translateY(-100%);
    }

    @media (max-width: 800px) {
      .photo-intro {
        grid-template-columns: 1fr;
      }

      .photo-intro-text {
        padding: 50px 30px;
      }

      .photo-intro-image {
        height: 60vh;
      }
    }
  </style>
</head>

<body>

  <nav class="top-nav" id="photo-nav">
    <a href="/">Home</a>
    <a href="/dissertation">Dissertation</a>
    <a href="/teaching">Teaching</a>
    <a href="/photography" class="active">Photography</a>
  </nav>

  <main class="photography-content">
    {{ content }}
  </main>

  <script>
    let lastScrollY = window.scrollY;
    const nav = document.getElementById("photo-nav");

    window.addEventListener("scroll", function () {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY && currentScrollY > 60) {
        nav.classList.add("nav-hidden");
      } else {
        nav.classList.remove("nav-hidden");
      }

      lastScrollY = currentScrollY;
    });
  </script>

</body>

</html>
