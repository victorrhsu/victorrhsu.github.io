```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Victor Y. Hsu</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .photography-content {
      margin: 0;
      padding: 52px 0 0 0;
      width: 100%;
      max-width: none;
    }

    /* Intro section */
    .photo-intro {
      width: 100%;
      max-width: none;

      margin: 0;
      padding: 85px 30px;

      float: none;
      box-sizing: border-box;
    }

    .photo-intro-text {
      display: block;
      width: 100%;
      max-width: 780px;

      margin: 0 auto;
      padding: 0;

      text-align: center;
    }

    .photo-intro-text p {
      margin: 0;

      font-size: 19px;
      line-height: 1.9;
      color: #555;
    }

    /* Full-screen slideshow */
    .photo-slider {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Slideshow dots */
    .slider-dots {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      gap: 9px;
      z-index: 10;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;

      transition: background 0.4s ease;
    }

    .dot.active {
      background: white;
    }

    /* Bird Spotlight section */
    .bird-spotlight {
      background: white;

      /* More breathing room around gallery */
      padding: 100px 70px 120px;

      width: 100%;
      max-width: none;
      float: none;

      margin: 0;
      box-sizing: border-box;
    }

    .bird-spotlight-heading {
      text-align: center;
      margin-bottom: 60px;
    }

    .bird-spotlight-heading h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 4px;
    }

    .bird-spotlight-line {
      width: 40px;
      height: 1px;
      background: #777;
      margin: 24px auto 0;
    }

    /* Gallery */
    .bird-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      /* Larger gaps like the reference */
      column-gap: 34px;
      row-gap: 65px;

      /* Slightly narrower overall gallery */
      width: calc(100% - 80px);
      max-width: 1180px;

      margin: 0 auto;
    }

    .bird-card {
      overflow: hidden;
    }

    .bird-card img {
      display: block;
      width: 100%;

      /* Smaller image height */
      height: 270px;

      object-fit: cover;
    }

    .bird-caption {
      margin: 14px 0 0;

      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: #666;
    }

    /* Navigation hide/show */
    #photo-nav {
      transition: transform 0.3s ease;
    }

    #photo-nav.nav-hidden {
      transform: translateY(-100%);
    }

    /* Tablet */
    @media (max-width: 900px) {
      .photo-intro {
        padding: 75px 30px;
      }

      .bird-spotlight {
        padding: 80px 40px 100px;
      }

      .bird-grid {
        width: 100%;
        column-gap: 24px;
        row-gap: 45px;
      }

      .bird-card img {
        height: 230px;
      }
    }

    /* Mobile */
    @media (max-width: 750px) {
      .photo-intro {
        padding: 60px 25px;
      }

      .photo-intro-text p {
        font-size: 17px;
      }

      .photo-slider {
        height: 70vh;
      }

      .bird-spotlight {
        padding: 70px 25px;
      }

      .bird-spotlight-heading {
        margin-bottom: 45px;
      }

      .bird-grid {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 38px;
      }

      .bird-card img {
        height: auto;
      }
    }
  </style>
</head>

<body>

  <nav class="top-nav" id="photo-nav">
    <a href="/">Home</a>
    <a href="/dissertation">Dissertation</a>
    <a href="/teaching">Teaching</a>
    <a href="/photography" class="active">Photography</a>
  </nav>

  <main class="photography-content">
    {{ content }}
  </main>

  <script>
    /* Hide navigation when scrolling down */
    let lastScrollY = window.scrollY;
    const nav = document.getElementById("photo-nav");

    window.addEventListener("scroll", function () {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY && currentScrollY > 60) {
        nav.classList.add("nav-hidden");
      } else {
        nav.classList.remove("nav-hidden");
      }

      lastScrollY = currentScrollY;
    });

    /* Slideshow */
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    let currentSlide = 0;
    let slideTimer;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });

      currentSlide = index;
    }

    function nextSlide() {
      const next = (currentSlide + 1) % slides.length;
      showSlide(next);
    }

    function startSlideshow() {
      slideTimer = setInterval(nextSlide, 4000);
    }

    dots.forEach((dot) => {
      dot.addEventListener("click", function () {
        clearInterval(slideTimer);

        const index = Number(this.dataset.slide);
        showSlide(index);

        startSlideshow();
      });
    });

    /* Start immediately when Photography page loads */
    startSlideshow();
  </script>

</body>

</html>
