<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Victor Y. Hsu</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .photography-content {
      margin: 0;
      padding: 52px 0 0 0;
      width: 100%;
      max-width: none;
    }

    .photo-intro {
      display: grid;
      grid-template-columns: 1fr 480px;
      gap: 70px;
      align-items: center;

      width: calc(100% - 120px);
      max-width: 1200px;

      margin: 0 auto;
      padding: 80px 0;

      min-height: auto;
      float: none;
      box-sizing: border-box;
    }

    .photo-intro-text {
      padding: 0;
      display: block;
    }

    .photo-intro-text p {
      font-size: 18px;
      line-height: 1.8;
      margin: 0;
      max-width: 570px;
    }

    .photo-intro-image {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .photo-intro-image img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .photo-section {
      margin: 0;
      padding: 0;
      width: 100%;
      line-height: 0;
    }

    .photo-section img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    #photo-nav {
      transition: transform 0.3s ease;
    }

    #photo-nav.nav-hidden {
      transform: translateY(-100%);
    }

    @media (max-width: 900px) {
      .photo-intro {
        grid-template-columns: 1fr 380px;
        gap: 40px;
        width: calc(100% - 60px);
      }
    }

    @media (max-width: 750px) {
      .photo-intro {
        grid-template-columns: 1fr;
        width: calc(100% - 40px);
        gap: 35px;
        padding: 50px 0;
      }

      .photo-intro-text p {
        font-size: 17px;
      }

      .photo-intro-image {
        max-width: 500px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <nav class="top-nav" id="photo-nav">
    <a href="/">Home</a>
    <a href="/dissertation">Dissertation</a>
    <a href="/teaching">Teaching</a>
    <a href="/photography" class="active">Photography</a>
  </nav>

  <main class="photography-content">
    {{ content }}
  </main>

  <script>
    let lastScrollY = window.scrollY;
    const nav = document.getElementById("photo-nav");

    window.addEventListener("scroll", function () {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY && currentScrollY > 60) {
        nav.classList.add("nav-hidden");
      } else {
        nav.classList.remove("nav-hidden");
      }

      lastScrollY = currentScrollY;
    });
  </script>

</body>

</html>
